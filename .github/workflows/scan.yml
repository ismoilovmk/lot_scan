name: Скан лотов

on:
  schedule:
    # каждые 20 минут с 07:00 до 20:59 по Ташкенту (в cron время UTC, Ташкент = UTC+5).
    # Минуты не круглые: в :00 у GitHub очередь, и запуски часто опаздывают или теряются.
    - cron: "7,27,47 2-15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробный проход: показать лоты в журнале, ничего не отправлять и не запоминать"
        type: boolean
        default: false

# два прохода одновременно писали бы в одну базу — второй ждёт первого
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write   # база просмотренных лотов сохраняется в ветку state

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # База отправленных лотов живёт в ветке state: сервер каждый раз чистый, а кэш GitHub может
      # пропасть, и тогда бот прислал бы всё заново. Ошибка чтения ветки останавливает проход.
      - name: Достать базу просмотренных лотов
        id: state
        if: ${{ !inputs.dry_run }}
        run: |
          code=0
          git ls-remote --exit-code --heads origin state > /dev/null || code=$?
          if [ "$code" = 0 ]; then
            git fetch --depth=1 origin state
            git show FETCH_HEAD:lots.db > lots.db
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 2 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      # Только на первый запуск после перехода с кэша на ветку state.
      - name: Перенести базу из кэша
        if: ${{ !inputs.dry_run && steps.state.outputs.found == 'false' }}
        uses: actions/cache/restore@v6
        with:
          path: lots.db
          key: lots-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lots-db-

      - name: Проверить площадки
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Сохранить базу
        if: ${{ always() && !inputs.dry_run && hashFiles('lots.db') != '' }}
        env:
          GIT_AUTHOR_NAME: lot-scan
          GIT_AUTHOR_EMAIL: lot-scan@users.noreply.github.com
          GIT_COMMITTER_NAME: lot-scan
          GIT_COMMITTER_EMAIL: lot-scan@users.noreply.github.com
        run: |
          blob=$(git hash-object -w --no-filters lots.db)
          tree=$(printf '100644 blob %s\tlots.db\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "База просмотренных лотов")
          git push --force origin "$commit:refs/heads/state"
