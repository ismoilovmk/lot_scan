# Настройки бота. После правки перезапустите бота.

# Как часто проверять площадки (команда "python main.py loop")
interval_minutes: 20

# Пауза между запросами к сайтам, секунд. Не уменьшайте: сайты ограничивают частые запросы.
request_pause_seconds: 0.5

# Какие площадки проверять
sources:
  uzex_etender: true       # etender.uzex.uz — тендеры и отборы (в списке есть название лота)
  uzex_auction: true       # xarid.uzex.uz — аукцион на понижение
  uzex_competition: true   # xarid.uzex.uz — отбор наилучших предложений (69-ПКМ)
  xt_xarid: true           # xt-xarid.uz — аукционы, отборы, запросы предложений, тендеры

# Сайты со своим лимитом запросов: пауза между запросами к ним, секунд.
# xt-xarid.uz из-за рубежа пускает один запрос в 60 секунд (проход по нему — около 5 минут).
# Когда бот будет работать с узбекского адреса, попробуйте уменьшить до 1.
host_pauses:
  api.xt-xarid.uz: 65

# Регионы для xt-xarid.uz — кодами самого сайта (он отбирает лоты у себя на сервере)
xt_xarid_regions:
  - "33.2466"   # Ферганская область
  - "33.2137"   # город Ташкент
  - "33.2152"   # Ташкентская область

# Сколько последних лотов раздела "отбор" просматривать за один проход
competition_max_lots: 300

# Лот подходит, если в названии, описании или категории есть любое из этих слов.
# Регистр не важен. Узбекские буквы ў қ ғ ҳ и апострофы учитываются автоматически,
# поэтому "farg'ona" и "fargona" — одно и то же.
keywords:
  - реклам
  - reklama
  - баннер
  - banner
  - вывеск
  - peshlavha
  - пешлавха
  - объемные буквы
  - объемных букв
  - hajmli harf
  - хажмли харф
  - световые буквы
  - световой короб
  - лайтбокс
  - lightbox
  - оракал
  - oracal
  - orakal
  - самоклеящ
  - широкоформат
  - uv-печат
  - uv печат
  - уф-печат
  - уф печат
  - uv bosma
  - полиграф
  - bosma xizmat
  - босма хизмат
  - билборд
  - bilbord
  - штендер
  - ролл-ап
  - roll-up
  - rollup
  - табличк
  - наклейк
  - стикер
  - плакат
  - информационный стенд
  - информационные стенды
  - информационных стендов
  - stend

# Эти фразы вырезаются из текста до поиска, чтобы не было ложных срабатываний
exclude_keywords:
  - рекламац          # рекламация — это претензия по качеству, а не реклама

# Лот подходит, если регион или район содержит любое из этих слов.
# "ташкент" захватывает и город, и Ташкентскую область.
regions:
