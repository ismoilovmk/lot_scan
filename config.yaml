# Если у лота вообще не указан регион — всё равно присылать (с пометкой)
allow_unknown_region: true

# Слова для отчёта по ценам конкурентов в Milliy do'kon (команда "python main.py prices")
shop_keywords:
  - баннер
  - широкоформат
  - вывеск
  - объемные буквы
  - оракал
