  - ферган
  - фаргона
  - fargona
  - fergana
  - коканд
  - кукон
  - qoqon
  - маргилан
  - маргилон
  - margilon
  - кувасай
  - кувасой
  - quvasoy
  - риштан
  - риштон
  - rishton
  - алтыарык
  - олтиарик
  - oltiariq
  - бешарык
  - бешарик
  - beshariq
  - язъяван
  - езевон
  - yozyovon
  # Ташкент
  - ташкент
  - тошкент
  - toshkent
  - tashkent
  # Районы города Ташкента (на etender регион иногда не указан, есть только район)
  - чиланзар
  - чилонзор
  - chilonzor
  - юнусабад
  - юнусобод
  - yunusobod
  - мирабад
  - миробод
  - mirobod
  - шайхантахур
  - шайхонтохур
  - shayxontohur
  - алмазар
